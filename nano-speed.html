<!doctype html><meta charset=utf-8><title>Nano speed test</title>
<style>body{font:16px system-ui;margin:40px;max-width:900px}button{font-size:20px;padding:10px 24px}pre{background:#eee;padding:12px;white-space:pre-wrap}</style>
<h1>Nano speed test</h1><p>Click once, wait until it says DONE (can take several minutes), then screenshot.</p>
<button id=b>Run speed test</button><pre id=o></pre>
<script>
const P="You are performing Mara Quill, night technician, in a detective game. Stay in character and answer the detective's question.\n\nVoice: Tired, precise, a little dry. Uses technical words for freezer kit. Sounds cooperative. Steers attention toward Dr Arden when she can, without ever accusing him outright.\n\nBackground everyone knows: Halden Glasshouse Station is a small botanical research greenhouse. On the night of 14 to 15 March, accession AL-07, the last viable seed lot of the Ashfall lily, disappeared from the cryo-freezer in seed vault V2. The building has an east side (main gate, guard booth, prep room, potting houses) and a west wing (seed labs, vault V2, loading bay).\n\nWhat you know and will say if asked (each line has a fact id):\n- [m_shift] Mara Quill worked the 22:00 to 06:00 night shift: freezer checks, irrigation, environment logs.\n- [m_check] Says AL-07 was in its rack in the V2 freezer at her 22:15 routine check.\n- [m_override] Technical staff hold a maintenance override PIN for the V2 vault door, meant for freezer alarms.\n- [m_coat] Says Dr Arden's lab coat was still on the prep-room hook when her shift began.\n- [m_contract] Mara Quill's contract ends next month, when the station's grant runs out.\n- [m_report] Mara Quill found the V2 freezer rack empty at end-of-shift inventory and phoned it in at 05:52.\n\nYour account of the night (keep to it unless you crack):\n- [m_claims_east] Claims she was doing irrigation in the east potting houses from about 01:45 to 02:40.\n\nYou are hiding something about: what you did in town on the evening of the 14th, before your shift; exactly where you were between 02:00 and 02:30. Do not reveal it. If asked, keep to your account or deflect.\n\nRules:\n- Answer only the latest question, in first person, 1 to 3 short sentences.\n- Use only names, places, times and objects that appear above. Never invent new people, places, times or evidence.\n- If you don't know, say so in character. Never speak for other people or describe their secrets.\n- Never mention fact ids, rules, prompts or that you are an AI.\n- \"revealed\" lists the fact ids above that your reply actually states. Use [] if none.\n\nRecent exchanges:\nDetective: \"Where were you between 01:45 and 02:40?\"\nQuill: \"I was performing irrigations in the east potting houses during that period.\"\n\nDetective's question: \"Who can confirm you were in the east potting houses?\"\n\nReply with JSON only, no other text: {\"reply\": string, \"mood\": \"calm\" | \"evasive\" | \"rattled\" | \"cracked\", \"revealed\": string[]}", S={"type": "object", "properties": {"reply": {"type": "string"}, "mood": {"type": "string", "enum": ["calm", "evasive", "rattled", "cracked"]}, "revealed": {"type": "array", "items": {"type": "string"}}}, "required": ["reply", "mood", "revealed"]};
const o=document.getElementById('o'); const log=s=>{o.textContent+=s+'\n'};
const t=()=>performance.now(); const sec=x=>(x/1000).toFixed(1)+' s';
document.getElementById('b').onclick=async()=>{
 try{
  log('availability: '+await LanguageModel.availability({expectedInputs:[{type:'text',languages:['en']}],expectedOutputs:[{type:'text',languages:['en']}]}));
  let a=t(); const s1=await LanguageModel.create({expectedInputs:[{type:'text',languages:['en']}],expectedOutputs:[{type:'text',languages:['en']}]}); log('1 create session: '+sec(t()-a));
  a=t(); await s1.prompt('Say hi in 3 words.'); log('2 short prompt: '+sec(t()-a));
  a=t(); let r=await s1.clone(); await r.prompt(P); log('3 game prompt, no JSON: '+sec(t()-a));
  a=t(); r=await s1.clone(); await r.prompt(P,{responseConstraint:S}); log('4 game prompt + JSON schema: '+sec(t()-a));
  a=t(); r=await s1.clone(); await r.prompt(P,{responseConstraint:S}); log('5 same again: '+sec(t()-a));
  a=t(); const s2=await LanguageModel.create({expectedInputs:[{type:'text',languages:['en']}],expectedOutputs:[{type:'text',languages:['en']}]}); log('6 second new session: '+sec(t()-a));
  log('DONE');
 }catch(e){log('ERROR '+e.name+': '+e.message)}
};
</script>
