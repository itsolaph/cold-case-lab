<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#D6DFD7" />
    <title>Cold Case Lab: The Ashfall Accession</title>
    <meta
      name="description"
      content="A one-case detective game. Interview suspects on-device with Gemini Nano, send evidence to a rationed cloud lab."
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="%BASE_URL%fonts/schibsted-grotesk-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%img/room.webp" as="image" type="image/webp" fetchpriority="high" />
    <style>
      /* First paint, before any JS: the wall, four empty hooks, a blank sheet under the lamp. */
      :root { --wall: #d6dfd7; --paper: #f7f6f1; --steel: #7f8a88; --hook: #4e5a55; }
      html, body { margin: 0; background: var(--wall); overflow-x: clip; }
      .boot { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .boot__hooks { position: absolute; top: 72px; left: 6%; display: grid; grid-template-columns: repeat(2, 14px); gap: 150px 110px; }
      .boot__hooks i { width: 14px; height: 14px; border-radius: 50%; background: var(--hook); opacity: 0.5; }
      .boot__sheet { width: min(560px, 100%); height: min(640px, 78vh); border-radius: 2px; background: var(--paper); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08), 0 6px 14px -8px rgba(0, 0, 0, 0.35); }
      @media (max-width: 600px) { .boot__hooks { display: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading the case">
        <div class="boot__hooks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="boot__sheet"></div>
      </div>
    </div>
    <noscript>Cold Case Lab needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
