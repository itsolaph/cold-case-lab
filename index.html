<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#E9EFF1" />
    <title>Cold Case Lab: The Ashfall Accession</title>
    <meta
      name="description"
      content="A one-case detective game. Interrogate suspects on-device with Gemini Nano, send evidence to a rationed cloud lab."
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="%BASE_URL%fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* First paint: the light table and a case-file skeleton, before any JS runs. */
      html { background: #e9eff1; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 70% 60% at 50% 40%, #fbfdfe 0%, rgba(251, 253, 254, 0) 70%), #e9eff1; }
      .boot { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .boot__card { width: min(640px, 100%); height: 520px; border-radius: 10px; background: rgba(255, 255, 255, 0.62); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), 0 0 0 1px rgba(28, 37, 43, 0.06), 0 14px 36px rgba(28, 37, 43, 0.12); padding: 48px; box-sizing: border-box; display: grid; align-content: start; gap: 18px; }
      .boot__bar { height: 14px; border-radius: 3px; background: linear-gradient(90deg, rgba(28, 37, 43, 0.06), rgba(28, 37, 43, 0.12), rgba(28, 37, 43, 0.06)); background-size: 200% 100%; animation: boot 1.4s linear infinite; }
      @keyframes boot { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot__bar { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading the case file">
        <div class="boot__card">
          <div class="boot__bar" style="width: 30%"></div>
          <div class="boot__bar" style="width: 80%; height: 56px"></div>
          <div class="boot__bar" style="width: 92%"></div>
          <div class="boot__bar" style="width: 70%"></div>
          <div class="boot__bar" style="width: 40%; height: 48px; margin-top: 32px"></div>
        </div>
      </div>
    </div>
    <noscript>Cold Case Lab needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
